<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1010" width="1440" height="1010" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="125%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="aTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker>
    <marker id="aPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <style>
      .h{font-size:16px;font-weight:700;fill:#111827}
      .p{font-size:13.5px;font-weight:600;fill:#1f2933}
      .s{font-size:12.5px;fill:#6b7280}
      .lbl{font-size:11.5px;fill:#475569}
      .zone{font-size:12px;font-weight:700;letter-spacing:2px;fill:#64748b}
      .card{fill:#ffffff;stroke:#d6dbe3;stroke-width:1.2}
      .hw{fill:#f8fafc;stroke:#cfd6df;stroke-width:1.2}
      .phys{stroke:#334155;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .att{stroke:#2563eb;stroke-width:2.2;fill:none;stroke-linejoin:round}
      .frp{stroke:#0d9488;stroke-width:2.2;stroke-dasharray:7 5;fill:none;stroke-linejoin:round}
      .llm{stroke:#7c3aed;stroke-width:2.2;stroke-dasharray:7 5;fill:none}
      .pwr{stroke:#d97706;stroke-width:2.6;fill:none}
      .mid{text-anchor:middle}
      .end{text-anchor:end}
    </style>
  </defs>

  <!-- Background -->
  <rect width="1440" height="1010" fill="#f5f7fa"/>

  <!-- ============ ZONES ============ -->
  <rect x="20" y="20" width="1400" height="222" rx="16" fill="#eaf1fb" stroke="#cfdcef"/>
  <text x="40" y="44" class="zone">INTERNET</text>

  <rect x="110" y="270" width="1310" height="520" rx="16" fill="#fff7ef" stroke="#f0c9a0" stroke-width="1.5"/>
  <text x="140" y="302" font-size="20" font-weight="700" fill="#111827">Proxmox VE Host</text>
  <text x="140" y="322" class="s">bare-metal virtualization</text>
  <text transform="translate(131,440) rotate(-90)" class="zone mid">VIRTUAL MACHINES</text>
  <text transform="translate(131,682) rotate(-90)" class="zone mid">HARDWARE</text>

  <rect x="110" y="815" width="750" height="180" rx="16" fill="#edf7f0" stroke="#c7e5d0"/>
  <text x="130" y="842" class="zone">HOME LAN</text>
  <text x="130" y="862" class="s">25 GbE wired network</text>

  <!-- ============ INTERNET ZONE ============ -->
  <!-- Cloud -->
  <path d="M70 180 a35 35 0 0 1 10 -68 a48 48 0 0 1 90 -20 a40 40 0 0 1 70 30 a32 32 0 0 1 0 58 z" fill="#ffffff" stroke="#b9cbe6" stroke-width="1.4" filter="url(#sh)"/>
  <text x="157" y="154" class="h mid">Internet</text>
  <text x="157" y="172" class="s mid">ISP</text>

  <!-- Remote management -->
  <rect x="290" y="80" width="220" height="100" rx="12" class="card" filter="url(#sh)"/>
  <rect x="306" y="108" width="34" height="24" rx="3" fill="none" stroke="#475569" stroke-width="1.8"/>
  <path d="M323 132 V140 M313 141 H333" stroke="#475569" stroke-width="1.8"/>
  <text x="352" y="118" class="p">Remote management</text>
  <text x="352" y="138" class="s">manage the home server</text>
  <text x="352" y="156" class="s">from anywhere</text>

  <!-- Azure -->
  <rect x="580" y="55" width="300" height="160" rx="12" class="card" filter="url(#sh)"/>
  <text x="600" y="84" class="h">Azure Cloud Server</text>
  <text x="600" y="103" class="s">public relay endpoint</text>
  <rect x="600" y="118" width="260" height="34" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="616" y="140" class="p">Public IP</text>
  <rect x="600" y="162" width="260" height="34" rx="8" fill="#e6f6f4" stroke="#b7e4dd"/>
  <text x="616" y="184" class="p">frps · FRP server</text>

  <!-- TACC GPU Server -->
  <rect x="960" y="40" width="440" height="185" rx="12" class="card" filter="url(#sh)"/>
  <text x="980" y="68" class="h">GPU Server · TACC</text>
  <text x="1380" y="68" class="s end">remote data center</text>
  <g>
    <rect x="982" y="86" width="90" height="56" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="1027" y="112" class="p mid">V100</text><text x="1027" y="130" class="lbl mid">GPU 0</text>
    <rect x="1084" y="86" width="90" height="56" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="1129" y="112" class="p mid">V100</text><text x="1129" y="130" class="lbl mid">GPU 1</text>
    <rect x="1186" y="86" width="90" height="56" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="1231" y="112" class="p mid">V100</text><text x="1231" y="130" class="lbl mid">GPU 2</text>
    <rect x="1288" y="86" width="90" height="56" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="1333" y="112" class="p mid">V100</text><text x="1333" y="130" class="lbl mid">GPU 3</text>
  </g>
  <text x="980" y="174" class="p" fill="#6d28d9" style="fill:#6d28d9">GLM5.3-flash</text>
  <text x="980" y="195" class="s">locally deployed LLM service</text>

  <!-- ============ VIRTUAL MACHINES ============ -->
  <!-- OpenWrt -->
  <rect x="145" y="345" width="275" height="190" rx="12" class="card" filter="url(#sh)"/>
  <circle cx="166" cy="372" r="5" fill="#2563eb"/>
  <text x="179" y="377" class="h">VM · OpenWrt</text>
  <text x="162" y="398" class="s">main router / gateway</text>
  <rect x="162" y="413" width="240" height="36" rx="8" fill="#eff6ff" stroke="#c7d8f7"/>
  <text x="177" y="436" class="p">Routing · WAN ⇄ LAN</text>
  <rect x="162" y="459" width="240" height="36" rx="8" fill="#e6f6f4" stroke="#b7e4dd"/>
  <text x="177" y="482" class="p">frpc · FRP client</text>

  <!-- Windows 10 -->
  <rect x="465" y="345" width="275" height="190" rx="12" class="card" filter="url(#sh)"/>
  <circle cx="486" cy="372" r="5" fill="#0ea5e9"/>
  <text x="499" y="377" class="h">VM · Windows 10</text>
  <text x="482" y="398" class="s">desktop VM</text>
  <rect x="482" y="413" width="240" height="36" rx="8" fill="#f0f9ff" stroke="#bae6fd"/>
  <text x="497" y="436" class="p">Async download</text>

  <!-- Linux -->
  <rect x="785" y="345" width="610" height="190" rx="12" class="card" filter="url(#sh)"/>
  <circle cx="806" cy="372" r="5" fill="#16a34a"/>
  <text x="819" y="377" class="h">VM · Linux</text>
  <text x="802" y="398" class="s">services &amp; storage</text>

  <rect x="805" y="418" width="180" height="56" rx="10" fill="#f1f5f9" stroke="#dbe2ea"/>
  <text x="895" y="451" class="p mid">Network proxy</text>

  <rect x="1005" y="418" width="190" height="56" rx="10" fill="#ecfdf3" stroke="#bbe5c8"/>
  <text x="1100" y="442" class="p mid">NFS pool (NAS)</text>
  <text x="1100" y="461" class="lbl mid">ZFS mirror + L2ARC</text>

  <rect x="1215" y="418" width="160" height="56" rx="10" fill="#f5f3ff" stroke="#d8ccfb"/>
  <text x="1295" y="442" class="p mid">Chatbot services</text>
  <text x="1295" y="461" class="lbl mid">uses remote LLM</text>

  <!-- ============ HARDWARE ============ -->
  <!-- Onboard RJ45 -->
  <rect x="145" y="595" width="160" height="175" rx="12" class="hw"/>
  <text x="225" y="648" class="h mid">Onboard NIC</text>
  <rect x="205" y="664" width="40" height="30" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <path d="M215 664 V672 H235 V664" fill="none" stroke="#475569" stroke-width="1.6"/>
  <text x="225" y="724" class="p mid">RJ45 · 1 GbE</text>
  <text x="225" y="744" class="s mid">WAN uplink</text>

  <!-- Mellanox ConnectX-4 -->
  <rect x="345" y="595" width="415" height="175" rx="12" class="hw"/>
  <rect x="362" y="607" width="386" height="104" rx="10" fill="#eef4ff" stroke="#bfd3f6" stroke-dasharray="4 3"/>
  <text x="445" y="625" class="lbl" style="font-weight:700;fill:#1d4ed8">SR-IOV</text>
  <rect x="380" y="635" width="100" height="62" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="430" y="662" class="h mid">PF</text>
  <text x="430" y="682" class="lbl mid">→ OpenWrt</text>
  <rect x="515" y="635" width="100" height="62" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="565" y="662" class="h mid">VF</text>
  <text x="565" y="682" class="lbl mid">→ Windows 10</text>
  <rect x="640" y="635" width="100" height="62" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="690" y="662" class="h mid">VF</text>
  <text x="690" y="682" class="lbl mid">→ Linux</text>
  <text x="600" y="746" class="h mid">Mellanox ConnectX-4 · 25 GbE</text>

  <!-- Storage -->
  <rect x="800" y="595" width="595" height="175" rx="12" class="hw"/>
  <rect x="815" y="607" width="300" height="128" rx="10" fill="#ffffff" stroke="#dbe1e8"/>
  <text x="830" y="628" class="p">SATA controller</text>
  <rect x="832" y="642" width="125" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <circle cx="858" cy="664" r="9" fill="none" stroke="#94a3b8" stroke-width="1.5"/><circle cx="858" cy="664" r="2" fill="#94a3b8"/>
  <text x="905" y="669" class="p mid">HDD</text>
  <rect x="973" y="642" width="125" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <circle cx="999" cy="664" r="9" fill="none" stroke="#94a3b8" stroke-width="1.5"/><circle cx="999" cy="664" r="2" fill="#94a3b8"/>
  <text x="1046" y="669" class="p mid">HDD</text>
  <text x="965" y="716" class="p mid" style="fill:#15803d">ZFS mirror (RAID1)</text>

  <rect x="1135" y="607" width="245" height="128" rx="10" fill="#ffffff" stroke="#dbe1e8"/>
  <text x="1150" y="628" class="p">PCIe SSD</text>
  <rect x="1165" y="642" width="185" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="1180" y="655" width="18" height="18" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1265" y="669" class="p mid">SSD</text>
  <text x="1257" y="716" class="p mid" style="fill:#15803d">ZFS L2ARC (read cache)</text>
  <text x="1097" y="757" class="s mid">both passed through to the Linux VM via PCIe</text>

  <!-- ============ HOME LAN ============ -->
  <rect x="300" y="850" width="260" height="80" rx="12" class="card" filter="url(#sh)"/>
  <text x="430" y="877" class="h mid">25 GbE Switch</text>
  <g fill="#e2e8f0" stroke="#94a3b8">
    <rect x="315" y="893" width="24" height="20" rx="3"/>
    <rect x="350" y="893" width="24" height="20" rx="3"/>
    <rect x="385" y="893" width="24" height="20" rx="3"/>
    <rect x="420" y="893" width="24" height="20" rx="3" fill="#334155"/>
    <rect x="455" y="893" width="24" height="20" rx="3"/>
    <rect x="490" y="893" width="24" height="20" rx="3"/>
    <rect x="525" y="893" width="24" height="20" rx="3" fill="#334155"/>
  </g>

  <rect x="640" y="846" width="190" height="32" rx="16" class="card"/>
  <circle cx="660" cy="862" r="4.5" fill="#16a34a"/><text x="673" y="867" class="p">Laptop</text>
  <rect x="640" y="889" width="190" height="32" rx="16" class="card"/>
  <circle cx="660" cy="905" r="4.5" fill="#16a34a"/><text x="673" y="910" class="p">Raspberry Pi</text>
  <rect x="640" y="932" width="190" height="32" rx="16" class="card"/>
  <circle cx="660" cy="948" r="4.5" fill="#16a34a"/><text x="673" y="953" class="p">Other physical devices</text>

  <!-- ============ UPS ============ -->
  <rect x="1110" y="830" width="285" height="110" rx="12" class="card" filter="url(#sh)"/>
  <rect x="1132" y="866" width="40" height="24" rx="4" fill="#fff7ed" stroke="#d97706" stroke-width="1.8"/>
  <rect x="1172" y="873" width="4" height="10" rx="1" fill="#d97706"/>
  <path d="M1154 870 L1146 880 H1152 L1149 887 L1158 876 H1152 Z" fill="#d97706"/>
  <text x="1192" y="874" class="h">UPS</text>
  <text x="1192" y="895" class="s">uninterruptible power</text>
  <text x="1192" y="912" class="s">for the Proxmox host</text>

  <!-- ============ LEGEND ============ -->
  <rect x="885" y="822" width="200" height="168" rx="12" class="card"/>
  <text x="902" y="847" class="zone">LEGEND</text>
  <line x1="902" y1="868" x2="937" y2="868" class="phys"/><text x="947" y="872" class="lbl">Physical cable</text>
  <line x1="902" y1="894" x2="937" y2="894" class="att"/><text x="947" y="898" class="lbl">VM ↔ host device</text>
  <line x1="902" y1="920" x2="937" y2="920" class="frp"/><text x="947" y="924" class="lbl">FRP tunnel</text>
  <line x1="902" y1="946" x2="937" y2="946" class="llm"/><text x="947" y="950" class="lbl">LLM API (SSH fwd)</text>
  <line x1="902" y1="972" x2="937" y2="972" class="pwr"/><text x="947" y="976" class="lbl">Power</text>

  <!-- ============ CONNECTORS ============ -->
  <!-- WAN uplink: onboard RJ45 → Internet -->
  <path d="M145 752 H75 V180" class="phys"/>
  <text transform="translate(97,440) rotate(-90)" class="lbl mid">1 GbE uplink → Internet</text>

  <!-- Remote management → Azure public IP -->
  <path d="M510 130 H575" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#aGray)"/>

  <!-- FRP tunnel: frpc (OpenWrt) → frps (Azure) -->
  <path d="M380 345 V256 H730 V218" class="frp" marker-end="url(#aTeal)"/>
  <rect x="448" y="246" width="246" height="20" rx="10" fill="#ffffff" stroke="#b7e4dd"/>
  <text x="571" y="260" class="lbl mid" style="fill:#0f766e;font-weight:600">FRP tunnel · frpc → frps (over WAN)</text>

  <!-- LLM API: TACC → Chatbot -->
  <path d="M1295 225 V415" class="llm" marker-end="url(#aPurple)"/>
  <text x="1285" y="302" class="p end" style="fill:#6d28d9">LLM API</text>
  <text x="1285" y="319" class="lbl end">SSH port-forward via OpenWrt WAN</text>

  <!-- VM ↔ host devices -->
  <path d="M285 535 V595" class="att"/>
  <text x="278" y="572" class="lbl end" style="font-weight:600">WAN</text>
  <path d="M405 535 V635" class="att"/>
  <text x="398" y="572" class="lbl end" style="font-weight:600">LAN</text>
  <path d="M565 535 V635" class="att"/>
  <path d="M690 635 V560 H830 V535" class="att"/>
  <path d="M965 607 V572 H1257 V607" class="att"/>
  <path d="M1100 572 V474" class="att"/>
  <text x="1108" y="558" class="lbl" style="font-weight:600;fill:#1d4ed8">PCIe passthrough</text>

  <!-- PF ↔ 25 GbE switch -->
  <path d="M430 697 V850" class="phys"/>
  <text x="440" y="807" class="lbl" style="font-weight:600">25 GbE</text>

  <!-- Switch → devices -->
  <path d="M560 890 C600 890 600 862 640 862" class="phys" style="stroke-width:2.2"/>
  <path d="M560 897 C600 897 600 905 640 905" class="phys" style="stroke-width:2.2"/>
  <path d="M560 904 C600 904 600 948 640 948" class="phys" style="stroke-width:2.2"/>

  <!-- Power: UPS → host -->
  <path d="M1250 830 V790" class="pwr"/>
  <text x="1258" y="814" class="lbl" style="fill:#b45309;font-weight:600">power</text>
</svg>
